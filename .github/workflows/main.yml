name: Flutter Quality & Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-and-tests:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: 📚 Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Flutter with Caching enabled
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # Caches the Flutter SDK and Pub tool to speed up builds
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      # 3. Install Dependencies
      - name: 📦 Install Dependencies
        run: flutter pub get

      # 4. Check for Vulnerabilities/Outdated Packages
      - name: 🛡️ Security & Dependency Audit
        run: dart pub outdated

      # 5. Verify Formatting (Fails if not formatted)
      - name: ✨ Verify Formatting
        run: dart format --set-exit-if-changed .

      # 6. Static Analysis (Using your analysis_options.yaml)
      - name: 🔍 Static Analysis
        run: flutter analyze

      # 7. Run Tests with Coverage
      - name: 🧪 Run Tests
        run: flutter test --coverage

      # 8. Check Code Coverage threshold
      - name: 📊 Check Coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 67.0
          exclude: "**/*.g.dart **/*.freezed.dart **/generated/**"

      # 9. Generate HTML Report
      - name: 📝 Generate HTML Report
        run: |
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html

      # 10. Upload Coverage Report
      - name: 🚀 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html

      # 11. Upload Golden Test Failures (only on failure)
      - name: 🖼️ Upload Golden Test Failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: test/**/failures/
